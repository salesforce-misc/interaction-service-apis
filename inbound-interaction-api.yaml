          $ref: "#/components/schemas/OrderType"
          example: "DigitalGoods"
        beneficiaries:
          minItems: 1
          description: "Beneficiaries for shipping physical goods."
          type: "array"
          items:
            $ref: "#/components/schemas/OrderBeneficiary"
        checkoutBehavior:
          $ref: "#/components/schemas/PaymentCheckoutBehavior"
        referenceId:
          type: "string"
          description: "Unique order reference"
      required:
      - "referenceId"
      - "type"
    PaymentRequestSupportedNetwork:
      description: "Supported networks for a payment request."
      type: "string"
      enum:
      - "AmericanExpress"
      - "Discover"
      - "Jcb"
      - "MasterCard"
      - "PrivateLabel"
      - "Visa"
      - "CartesBancaires"
      - "ChinaUnionPay"
      - "Eftpos"
      - "Electron"
      - "Elo"
      - "Girocard"
      - "Interac"
      - "Mada"
      - "Maestro"
      - "Mir"
      - "VPay"
      example: "AmericanExpress"
    PaymentRequestLineItem:
      allOf:
      - $ref: "#/components/schemas/AbstractPaymentLineItem"
      - type: "object"
        properties:
          saleAmount:
            format: "currency"
            type: "number"
            description: "Optional discounted price of the line item. Must be < amount."
          image:
            $ref: "#/components/schemas/ImageAsset"
          amount:
            format: "currency"
            type: "number"
            description: "The price of the line item."
          quantity:
            description: "Quantity of this item; 'amount' is unit price when quantity > 1."
            default: 1
            type: "integer"
            minimum: 1
          automaticReloadPaymentThresholdAmount:
            format: "currency"
            type: "number"
            description: "The balance on an account, before the merchant applies automatic reload amount."
          timing:
            $ref: "#/components/schemas/AbstractTiming"
          discount:
            $ref: "#/components/schemas/Discount"
            description: "Optional per-line discount object. Use when a discount program/name must be preserved."
          label:
            type: "string"
            description: "A short description of the line item."
          commerce:
            $ref: "#/components/schemas/OrderItemCommerceAttributes"
            description: "Catalog & compliance metadata."
          status:
            $ref: "#/components/schemas/PaymentItemStatus"
        required:
        - "label"
        - "amount"
      description: "Payment Request Line Item"
    DocumentMediaUploadInput:
      allOf:
      - $ref: "#/components/schemas/AbstractMediaUploadInput"
      - type: "object"
        properties:
          allowedMimeTypes:
            minItems: 1
            description: "Allowed MIME types for document uploads."
            type: "array"
            items:
              $ref: "#/components/schemas/MimeType"
      description: "An input for uploading documents."
    ShippingMethodValue:
      allOf:
      - $ref: "#/components/schemas/AbstractValue"
      - type: "object"
        properties:
          shippingMethod:
            $ref: "#/components/schemas/AbstractShippingMethod"
        required:
        - "shippingMethod"
      description: "A shipping method value"
    Discount:
      description: "Discount details for an order or line item."
      additionalProperties: false
      type: "object"
      properties:
        description:
          description: "Optional user-visible description of the discount."
          type: "string"
          maxLength: 200
          example: "Festival offer - 10% off"
        amount:
          format: "currency"
          description: "Absolute discount applied to this line (positive number)."
          type: "number"
          example: 25
        code:
          description: "Optional coupon/promo code presented to user."
          type: "string"
          maxLength: 64
          example: "WELCOME10"
        programName:
          description: "Discount program name."
          type: "string"
          maxLength: 120
          example: "DIWALI_SALE_2025"
      required:
      - "amount"
    AbstractPaymentRequest:
      type: "object"
      properties:
        formatType:
          $ref: "#/components/schemas/FormatType"
      required:
      - "formatType"
      discriminator:
        propertyName: "formatType"
        mapping:
          MessageDefinition: "#/components/schemas/PaymentRequestMessageDefinition"
          Payment: "#/components/schemas/PaymentRequestPayment"
    AbstractProgressMessage:
      description: "Base definition for all progress messages"
      type: "object"
      properties:
        formatType:
          description: "The list of Format Types supported. Required."
          $ref: "#/components/schemas/FormatType"
      required:
      - "formatType"
      discriminator:
        propertyName: "formatType"
        mapping:
          Text: "#/components/schemas/TextProgressMessage"
    AbstractPaymentRequestDetails:
      type: "object"
      properties:
        paymentRequestDetailsType:
          $ref: "#/components/schemas/PaymentRequestDetailsType"
      required:
      - "paymentRequestDetailsType"
      discriminator:
        propertyName: "paymentRequestDetailsType"
        mapping:
          PaymentRequestDetails: "#/components/schemas/PaymentRequestDetails"
    StaticContentErrorMessage:
      allOf:
      - $ref: "#/components/schemas/AbstractStaticContent"
      - type: "object"
        properties:
          title:
            type: "string"
          errorDetails:
            $ref: "#/components/schemas/ErrorDetails"
        required:
        - "errorDetails"
    MessageReason:
      type: "string"
      description: "Enum listing unique and specific reason a message was sent."
      enum:
      - "AutomatedResponse"
      - "Consent"
    OrderItemCategory:
      type: "string"
      description: "Classification used to compute order totals."
      enum:
      - "Product"
      - "Tax"
      - "Fee"
    PaymentLineItemType:
      description: "The type of payment line item."
      type: "string"
      enum:
      - "PaymentRequestLineItem"
      example: "PaymentRequestLineItem"
    PaymentMethodHint:
      type: "string"
      description: "High-level payment method categories supported by provider checkout/link."
      enum:
      - "Card"
      - "Upi"
      - "NetBanking"
      - "Wallet"
      - "Boleto"
      - "Pix"
      - "PayLater"
      - "Emi"
    ConfirmSection:
      description: "Optional confirmation prompt to display for form."
      additionalProperties: false
      type: "object"
      properties:
        message:
          type: "string"
          description: "Optional confirmation text shown to the user."
          minLength: 1
    BodyContentSection:
      allOf:
      - $ref: "#/components/schemas/AbstractContentSection"
      - type: "object"
        properties:
          bodyContents:
            minItems: 1
            type: "array"
            items:
              $ref: "#/components/schemas/AbstractContent"
          addSecurityRecommendation:
            type: "boolean"
            description: "Whether to show a security recommendation in the body (Authentication templates)."
        required:
        - "bodyContents"
      description: "A body content section"
    VisibilityStrategy:
      type: "string"
      description: "Enum listing unique visibility strategies for entries."
      enum:
      - "Default"
      - "Internal"
    PaymentRequestDetails:
      allOf:
      - $ref: "#/components/schemas/AbstractPaymentRequestDetails"
      - type: "object"
        properties:
          allowedUpdateActionTypes:
            type: "array"
            description: "The set of allowed update actions by the end user like payment update, shipping contact update, etc."
            items:
              $ref: "#/components/schemas/PaymentUpdateTypes"
          endpoints:
            $ref: "#/components/schemas/PaymentRequestEndPoints"
          totalLineItem:
            $ref: "#/components/schemas/AbstractPaymentLineItem"
            description: "The total of all the line items."
          requiredShippingContactFields:
            type: "array"
            description: "The list of shipping information fields required to fulfill this order."
            items:
              $ref: "#/components/schemas/PaymentRequestContactField"
          merchantCapabilities:
            type: "array"
            description: "The list of payment capabilities supported by the merchant."
            items:
              $ref: "#/components/schemas/PaymentRequestMerchantCapability"
          discount:
            $ref: "#/components/schemas/Discount"
            description: "Discount applicable on the complete order"
          requiredBillingContactFields:
            type: "array"
            description: "The list of billing information fields required to process this transaction."
            items:
              $ref: "#/components/schemas/PaymentRequestContactField"
          merchantName:
            type: "string"
            description: "Merchant name"
          lineItems:
            minItems: 1
            description: "A set of line items explaining the charges or recurring payments."
            type: "array"
            items:
              $ref: "#/components/schemas/AbstractPaymentLineItem"
          merchantIdentifier:
            type: "string"
            description: "Merchant ID"
          supportedPaymentNetworks:
            type: "array"
            description: "The list of payment networks supported by the merchant."
            items:
              $ref: "#/components/schemas/PaymentRequestSupportedNetwork"
          merchantDomain:
            type: "string"
            description: "Domain name associated with the Merchant Account"
          paymentInitiations:
            type: "array"
            description: "One or more ways to initiate payment."
            items:
              $ref: "#/components/schemas/PaymentInitiation"
          countryCode:
            type: "string"
            description: "Two-letter ISO 3166 country code of Merchant."
            example: "US"
          merchantIdentityCertificate:
            type: "string"
            description: "Merchant certificate"
          shippingAmount:
            format: "currency"
            type: "number"
            description: "Computed cost for the currently selected shipping method (or flat shipping for the order)."
          merchantIdentityKey:
            type: "string"
            description: "Merchant key"
          currencyCode:
            type: "string"
            description: "Three-letter ISO 4217 currency code of payment."
            example: "USD"
          order:
            $ref: "#/components/schemas/OrderContext"
          shippingMethods:
            type: "array"
            description: "The list of available shipping methods."
            items:
              $ref: "#/components/schemas/AbstractShippingMethod"
          supportedCountries:
            type: "array"
            description: "Two-letter ISO 3166 country code of supported countries."
            items:
              type: "string"
        required:
        - "countryCode"
        - "currencyCode"
        - "lineItems"
        - "totalLineItem"
      description: "Payment Request Details"
    ConversationUpdated:
      allOf:
      - $ref: "#/components/schemas/AbstractEntry"
      - type: "object"
        properties:
          updates:
            type: "array"
            description: "List of update operations that were applied"
            items:
              $ref: "#/components/schemas/ConversationUpdateOperation"
          updatedBy:
            $ref: "#/components/schemas/Participant"
            description: "Participant who initiated the update"
        required:
        - "updates"
        - "updatedBy"
      description: "A conversation updated entry indicating conversation-level field changes"
    TextContentType:
      type: "string"
      description: "The content format of the text."
      enum:
      - "PlainText"
      - "Markdown"
    CardCarouselSection:
      description: "Represents a single carousel card."
      type: "object"
      properties:
        contentSections:
          minItems: 1
          type: "array"
          items:
            $ref: "#/components/schemas/AbstractContentSection"
        templateSections:
          type: "array"
          items:
            $ref: "#/components/schemas/AbstractTemplateSection"
      required:
      - "contentSections"
    ConversationActionType:
      type: "string"
      description: "Enum listing supported action types for conversation entries."
      enum:
      - "DeliveryAck"
      - "ReadAck"
      - "Sdr"
      - "Reaction"
      - "Translation"
      - "Feedback"
    AbstractContentSection:
      description: "The base type of a content section"
      type: "object"
      properties:
        examples:
          $ref: "#/components/schemas/ContentSectionExamples"
          description: "Optional map of parameter index or name to example values for dynamic parameters in this section."
        sectionType:
          $ref: "#/components/schemas/ContentSectionType"
      required:
      - "sectionType"
      discriminator:
        propertyName: "sectionType"
    AbstractActionPayload:
      description: "Base definition for all action types. The schema is determined by the actionType discriminator."
      type: "object"
      properties:
        actionType:
          $ref: "#/components/schemas/ConversationActionType"
        id:
          $ref: "#/components/schemas/ActionId"
      required:
      - "actionType"
      discriminator:
        propertyName: "actionType"
        mapping:
          Sdr: "#/components/schemas/SdrActionPayload"
          Translation: "#/components/schemas/TranslationActionPayload"
          Reaction: "#/components/schemas/ReactionActionPayload"
          Feedback: "#/components/schemas/FeedbackActionPayload"
          ReadAck: "#/components/schemas/ReadActionPayload"
          DeliveryAck: "#/components/schemas/DeliveryActionPayload"
    InlineMetadataCitedDetails:
      allOf:
      - $ref: "#/components/schemas/AbstractCitedDetails"
      - type: "object"
        properties:
          inlineMetadata:
            minItems: 1
            type: "array"
            items:
              $ref: "#/components/schemas/CitedInlineMetadata"
        required:
        - "inlineMetadata"
      description: "Collection of inline metadata for a cited reference."
    PaymentError:
      description: "Payment Error Details"
      type: "object"
      properties:
        errorMessage:
          type: "string"
        errorCode:
          $ref: "#/components/schemas/PaymentErrorCode"
      required:
      - "errorMessage"
      - "errorCode"
    FontStyle:
      type: "string"
      description: "Font style for text components."
      enum:
      - "Italic"
    StaticContentButtons:
      allOf:
      - $ref: "#/components/schemas/AbstractStaticContent"
      - type: "object"
        properties:
          actions:
            minItems: 1
            type: "array"
            items:
              $ref: "#/components/schemas/AbstractAction"
          linkItems:
            minItems: 1
            description: "Deprecated. Use actions with ActionType.LinkAction items instead."
            type: "array"
            items:
              $ref: "#/components/schemas/TitleLinkItem"
            deprecated: true
          text:
            $ref: "#/components/schemas/Text"
        required:
        - "text"
      description: "Text with buttons"
    PaymentRequestEndPoints:
      type: "object"
      description: "Payment Request EndPoints"
      properties:
        fallbackUrl:
          $ref: "#/components/schemas/Url"
    OAuthTokenRequestType:
      description: "Type of OAuth Token Request"
      type: "string"
      enum:
      - "OAuthDelegatedClientSecretTokenRequest"
      example: "OAuthDelegatedClientSecretTokenRequest"
    RecurringTiming:
      allOf:
      - $ref: "#/components/schemas/AbstractTiming"
      - type: "object"
        properties:
          endDate:
            format: "date"
            type: "string"
          startDate:
            format: "date"
            type: "string"
          intervalCount:
            type: "integer"
          intervalUnit:
            $ref: "#/components/schemas/TimingIntervalUnit"
        required:
        - "startDate"
        - "intervalUnit"
        - "intervalCount"
      description: "Recurring Timing"
    SurveyChoicesResponseMessage:
      allOf:
      - $ref: "#/components/schemas/AbstractMessage"
      - type: "object"
        properties:
          choicesResponse:
            $ref: "#/components/schemas/AbstractChoicesResponse"
        required:
        - "choicesResponse"
      description: "MO response to a survey choices message. Linked to the original survey via inReplyToMessageId."
    WebViewDisplayType:
      type: "string"
      description: "How a StaticContentWebView should be displayed."
      enum:
      - "AutoOverlay"
    CitedInlineMetadata:
      description: "Inline metadata for a citation."
      type: "object"
      properties:
        claim:
          $ref: "#/components/schemas/CitationClaim"
        citedLocationOffset:
          type: "integer"
          description: "The offset position in the message where a citation anchor should be added for this citation."
      required:
      - "citedLocationOffset"
    PaymentStatus:
      description: "Payment status"
      type: "string"
      enum:
      - "Success"
      - "Error"
      - "Pending"
      - "Other"
      example: "Success"
    LogicalOperator:
      type: "string"
      enum:
      - "And"
      - "Or"
    IfElement:
      allOf:
      - $ref: "#/components/schemas/AbstractElement"
      - type: "object"
        properties:
          condition:
            $ref: "#/components/schemas/AbstractConditionExpression"
          else:
            type: "array"
            items:
              $ref: "#/components/schemas/SectionElement"
          then:
            minItems: 1
            type: "array"
            items:
              $ref: "#/components/schemas/SectionElement"
        required:
        - "condition"
        - "then"
      description: "Conditional element that renders content based on a condition"
    Recipient:
      description: "A Recipient"
      type: "object"
      properties:
        identifier:
          type: "string"
        displayName:
          type: "string"
        contact:
          type: "string"
      required:
      - "identifier"
    ChoicesConfirmMessage:
      allOf:
      - $ref: "#/components/schemas/AbstractChoices"
      - type: "object"
        properties:
          confirm:
            minItems: 1
            type: "array"
            items:
              $ref: "#/components/schemas/ActionInvocation"
          message:
            type: "string"
        required:
        - "message"
        - "confirm"
    CurrencyAmount:
      description: "The base type for currency amounts"
      type: "object"
      properties:
        currencyCode:
          type: "string"
          description: "Three-letter ISO 4217 currency code."
          example: "USD"
        amount:
          format: "currency"
          description: "The amount in decimal."
          type: "number"
          example: "25.50"
      required:
      - "currencyCode"
      - "amount"
    ComparisonCondition:
      allOf:
      - $ref: "#/components/schemas/AbstractConditionExpression"
      - description: "Comparison between two values. Both sides should have the same type and at least one of them should contain a dynamic variable"
        type: "object"
        properties:
          left:
            $ref: "#/components/schemas/DynamicValue"
          operator:
            $ref: "#/components/schemas/ComparisonOperator"
          right:
            $ref: "#/components/schemas/DynamicValue"
        required:
        - "operator"
        - "left"
        - "right"
    OAuthCodeDelegatedExchangeAuthorizationRequest:
      allOf:
      - $ref: "#/components/schemas/AbstractOAuthAuthorizationRequest"
      - type: "object"
      description: "OAuth Delegated Code Authorization Request"
    PaymentInitiationUpi:
      additionalProperties: false
      type: "object"
      properties:
        payeeHandle:
          type: "string"
          description: "UPI VPA/handle"
          example: "acme@icici"
        intentLink:
          $ref: "#/components/schemas/Url"
          description: "Full UPI deep link from PG."
          example: "upi://pay?pa=acme@icici&pn=ACME&am=1769.00&cu=INR&tr=ORD-8421"
        merchantCategoryCode:
          type: "string"
      required:
      - "intentLink"
    Modality:
      type: "string"
      description: "The modality of a conversation or entry"
      enum:
      - "Unknown"
      - "Messaging"
      - "Voice"
    MessagePrompt:
      description: "A message bubble with specific content section like header, body, footer along with button label, that leads to the flow."
      type: "object"
      properties:
        header:
          $ref: "#/components/schemas/HeaderContentSection"
        body:
          type: "string"
        footer:
          $ref: "#/components/schemas/FooterContentSection"
        buttonLabel:
          type: "string"
      required:
      - "body"
    FileTransferRequest:
      allOf:
      - $ref: "#/components/schemas/AbstractEntry"
      - type: "object"
        properties:
          fileTransferToken:
            type: "string"
            description: "Short-lived JWT authorising the end user to upload a file for this conversation"
          expirationTimestamp:
            format: "int64"
            description: "Request expiry as epoch milliseconds (now + 30 min); mirrors the capability token's exp claim. Lets the end-user client drive expiry UX without decoding the JWT."
            type: "integer"
            example: 1746379434000
        required:
        - "fileTransferToken"
        - "expirationTimestamp"
      description: "A request for the end user to upload a file"
    TimingType:
      description: "The type of timing."
      type: "string"
      enum:
      - "RecurringTiming"
      - "DeferredTiming"
      example: "RecurringTiming"
    PhoneCallAction:
      allOf:
      - $ref: "#/components/schemas/AbstractAction"
      - type: "object"
        properties:
          phoneNumber:
            type: "string"
        required:
        - "phoneNumber"
      description: "An action to make a phone call"
    ConversationAction:
      description: "Represents a conversation action performed on a conversation entry"
      type: "object"
      properties:
        actionType:
          $ref: "#/components/schemas/ConversationActionType"
        actionPayload:
          type: "string"
        performedBy:
          $ref: "#/components/schemas/Participant"
        serverReceivedTimestamp:
          format: "int64"
          type: "integer"
        actionId:
          type: "string"
        conversationEntryIdentifier:
          type: "string"
        actionInitiatedAt:
          format: "int64"
          type: "integer"
      required:
      - "conversationEntryIdentifier"
      - "actionId"
      - "actionType"
      - "actionInitiatedAt"
      - "serverReceivedTimestamp"
      - "actionPayload"
      - "performedBy"
    PaymentErrorCode:
      description: "Error codes for payment failures"
      type: "string"
      enum:
      - "ShippingContactInvalid"
      - "BillingContactInvalid"
      - "AddressUnserviceable"
      - "CouponCodeInvalid"
      - "CouponCodeExpired"
      - "Unknown"
      example: "ShippingContactInvalid"
    PaymentRequestMessageDefinition:
      allOf:
      - $ref: "#/components/schemas/AbstractPaymentRequest"
      - type: "object"
        properties:
          parameters:
            type: "array"
            items:
              $ref: "#/components/schemas/NamedValue"
          messageDefinitionNameOrId:
            $ref: "#/components/schemas/MessageDefinitionNameOrId"
          targetLocale:
            $ref: "#/components/schemas/Locale"
            description: "The requested locale the message should be translated into"
            example: "en-US"
        required:
        - "messageDefinitionNameOrId"
      description: "References to a layout of payment request"
    AbstractAuthenticationRequest:
      type: "object"
      properties:
        formatType:
          $ref: "#/components/schemas/FormatType"
      required:
      - "formatType"
      discriminator:
        propertyName: "formatType"
        mapping:
          EncryptedOAuthToken: "#/components/schemas/AuthenticationRequestEncryptedOAuthToken"
          MessageDefinition: "#/components/schemas/AuthenticationRequestMessageDefinition"
    PaymentInitiationPix:
      additionalProperties: false
      type: "object"
      properties:
        keyType:
          $ref: "#/components/schemas/PaymentPixKeyType"
        key:
          type: "string"
          description: "Pix key value (per keyType)."
        code:
          type: "string"
          description: "EMVCo Pix 'Copia e Cola' string."
      required:
      - "code"
      - "keyType"
      - "key"
    AbstractExperienceTypeFormResponse:
      type: "object"
      properties:
        responseType:
          $ref: "#/components/schemas/ExperienceTypeFormResponseType"
      required:
      - "responseType"
      discriminator:
        propertyName: "responseType"
    CompleteFormAction:
      allOf:
      - $ref: "#/components/schemas/AbstractFormAction"
      description: "A complete action"
    PaymentGatewayTransaction:
      allOf:
      - $ref: "#/components/schemas/AbstractTransaction"
      - type: "object"
        properties:
          gateway:
            $ref: "#/components/schemas/PaymentInitiationGateway"
      description: "A payment transaction as reported by the payment gateway"
    ExternalTemplateSubCategory:
      type: "string"
      description: "The sub-categories of external templates"
      enum:
      - "OrderStatus"
      - "MediaCard"
      - "ProductCard"
    TranslationActionPayload:
      allOf:
      - $ref: "#/components/schemas/AbstractActionPayload"
      - type: "object"
        properties:
          sourceLocale:
            type: "string"
            description: "Locale of the source text (BCP 47, e.g. \"es\", \"fr-CA\")"
          translationDirection:
            $ref: "#/components/schemas/TranslationDirection"
          targetLocale:
            type: "string"
            description: "Locale the text was translated to"
          terminologyFileName:
            type: "string"
            description: "Terminology resource name. Omitted when no terminology configured."
          provider:
            type: "string"
            description: "Translation engine (e.g. - AWS)."
          terminologyFileApplied:
            type: "boolean"
            description: "Whether terminology file was configured at translation time."
          structuredContent:
            type: "object"
            description: "Translated structured content. Null for simple text."
          content:
            type: "string"
            description: "The translated or original text being recorded. For outbound translations (agent typed in source language), this is the agent's original text. For inbound translations (end user sent in source language), this is the translated text the agent sees."
        required:
        - "sourceLocale"
        - "targetLocale"
        - "translationDirection"
        - "provider"
      description: "Records translation context for a conversation entry. Carries metadata indicating the source locale, target locale, and content in one of those locales depending on direction (inbound or outbound translation)."
    SurveyStaticContentMessage:
      allOf:
      - $ref: "#/components/schemas/AbstractSurveyMessage"
      - type: "object"
        properties:
          staticContent:
            $ref: "#/components/schemas/AbstractStaticContent"
        required:
        - "staticContent"
      description: "MT survey message with static content (e.g. survey link, thank you message)."
    CatalogMessage:
      allOf:
      - $ref: "#/components/schemas/AbstractMessage"
      - type: "object"
        properties:
          catalog:
            $ref: "#/components/schemas/AbstractCatalog"
        required:
        - "catalog"
      description: "Share products or services with the end user"
    OrderStatusTemplateSection:
      allOf:
      - $ref: "#/components/schemas/AbstractTemplateSection"
      - type: "object"
        properties:
          orderStatusUpdate:
            $ref: "#/components/schemas/OrderStatusUpdate"
        required:
        - "orderStatusUpdate"
