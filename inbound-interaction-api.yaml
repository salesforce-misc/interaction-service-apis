      - "value"
    ChoicesBusinessUpdate:
      allOf:
      - $ref: "#/components/schemas/AbstractChoices"
      - type: "object"
        properties:
          brandName:
            type: "string"
            description: "Brand name shown on the invitation card. Template parameter for binaryChoice.engage.withImage."
            example: "Acme Corp"
          brandLogoAsset:
            $ref: "#/components/schemas/ImageAsset"
          locale:
            type: "string"
            description: "Language code used to render the invitation (e.g. en-us). If omitted, Apple uses the template's default language."
            example: "en-us"
          templateId:
            description: "Apple's invitation template identifier. Currently fixed to binaryChoice.engage.withImage; this template renders exactly two buttons (accept / decline)."
            default: "binaryChoice.engage.withImage"
            type: "string"
            enum:
            - "binaryChoice.engage.withImage"
            example: "binaryChoice.engage.withImage"
          brandLogo:
            type: "string"
            description: "Base64-encoded PNG shown on the invitation card. Template parameter for binaryChoice.engage.withImage."
            example: "iVBORw0KGgoAAAANSUhEUgAA..."
          referenceId:
            description: "Business reference for the invitation (e.g. caseNumber, orderId). Echoed back in the user's response. Must be <= 1000 characters and must not contain quote or apostrophe characters."
            type: "string"
            maxLength: 1000
            example: "caseNumber:1009273616"
        required:
        - "templateId"
        - "referenceId"
        - "brandName"
        - "brandLogo"
      description: "Apple Business Update (invitation) message with two interactive options (accept / decline). The two-button structure is implicit in Apple's binaryChoice.engage.withImage template — Yes/No are rendered by Apple's client, not modeled as schema option items. Sent as an outbound MT to invite an end user into a conversation; the user's response comes back as a ChoicesResponseMessage tagged with customHandlingType=InvitationResponse and selectedOptions = [{optionIdentifier: \"urn:apple:invitation:accepted\"}] (Yes) or [{optionIdentifier: \"urn:apple:invitation:declined\"}] (No)."
