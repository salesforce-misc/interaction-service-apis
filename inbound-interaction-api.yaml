security:
- BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      name: "Authorization"
      bearerFormat: "AccessToken"
      type: "http"
      scheme: "bearer"
      in: "header"
  schemas:
    AbstractChoicesResponse:
      type: "object"
      properties:
        formatType:
          $ref: "#/components/schemas/FormatType"
      required:
      - "formatType"
      discriminator:
        propertyName: "formatType"
        mapping:
          Selections: "#/components/schemas/ChoicesResponseSelections"
          ExperienceType: "#/components/schemas/ChoicesResponseExperienceType"
    DimensionType:
      type: "string"
      description: "If specified indicates how the dimension field should be interpreted."
      enum:
      - "PIXEL"
      - "RATIO"
    SelectInput:
      allOf:
      - $ref: "#/components/schemas/AbstractInput"
      - type: "object"
        properties:
          selectionDisplay:
            $ref: "#/components/schemas/SelectionDisplay"
            description: "How the options should be displayed"
          multipleSelection:
            type: "boolean"
          optionItems:
            minItems: 1
            type: "array"
            items:
              $ref: "#/components/schemas/TitleOptionItem"
        required:
        - "optionItems"
      - type: "object"
        properties:
          dynamicOptionItems:
            $ref: "#/components/schemas/DynamicReference"
          secondaryLabel:
            $ref: "#/components/schemas/DynamicValue"
            description: "Secondary label for the input"
          maximumSelectionCount:
            $ref: "#/components/schemas/DynamicValue"
            description: "Maximum number of items could be selected"
          minimumSelectionCount:
            $ref: "#/components/schemas/DynamicValue"
            description: "Minimum number of items must be selected"
      description: "A single or multiple select input"
    PostRouteResponse:
      type: "object"
      properties:
        reasonForNotRouting:
          type: "string"
          description: "Reason for not routing this request"
          maxLength: 240
        routingCorrelationId:
          type: "string"
          description: "CorrelationId which should be associated in agent work"
          maxLength: 240
        success:
          type: "boolean"
          description: "Indicates the routing request was successful or not"
          maxLength: 240
        contextParamMap:
          type: "object"
          description: "Additional context related to routing response like userId, queueId, etc"
          additionalProperties:
            type: "string"
        psrId:
          type: "string"
          description: "Salesforce pendingServiceRouting Id"
          maxLength: 240
        workItemId:
          type: "string"
          description: "Salesforce WorkItem Id"
          maxLength: 240
        errors:
          $ref: "#/components/schemas/RoutingError"
    ChoicesButtons:
      allOf:
      - $ref: "#/components/schemas/AbstractChoices"
      - type: "object"
        properties:
          optionItems:
            minItems: 1
            description: "Items must be of type TitleOptionItem."
            type: "array"
            items:
              $ref: "#/components/schemas/TitleOptionItem"
          text:
            type: "string"
        required:
        - "text"
        - "optionItems"
      description: "Choices with button options"
    DocumentAsset:
      allOf:
      - $ref: "#/components/schemas/AbstractAsset"
      description: "A document asset of a message."
    AbstractInputSection:
      description: "Common attributes for all input section types"
      type: "object"
      properties:
        sectionType:
          $ref: "#/components/schemas/InputSectionType"
      required:
      - "sectionType"
      discriminator:
        propertyName: "sectionType"
    FormInputs:
      allOf:
      - $ref: "#/components/schemas/AbstractForm"
      - type: "object"
        properties:
          formTitle:
            $ref: "#/components/schemas/AbstractTitleItem"
          images:
            type: "array"
            items:
              $ref: "#/components/schemas/ImageAsset"
          introScreen:
            $ref: "#/components/schemas/AbstractFormIntroScreen"
          message:
            $ref: "#/components/schemas/AbstractTitleItem"
          reply:
            $ref: "#/components/schemas/AbstractTitleItem"
          sections:
            minItems: 1
            type: "array"
            items:
              $ref: "#/components/schemas/AbstractInputSection"
        required:
        - "formTitle"
        - "sections"
      description: "A form with inputs"
    AcknowledgementResponse:
      description: "Response after sending read / delivered acknowledgment"
      type: "object"
      properties:
        success:
          type: "boolean"
          description: "Status of the consent status update request"
      required:
      - "success"
    TitleItemWithInteractions:
      additionalProperties: false
      type: "object"
      properties:
        titleItem:
          $ref: "#/components/schemas/AbstractTitleItem"
        interactionItems:
          minItems: 1
          type: "array"
          items:
            $ref: "#/components/schemas/AbstractTitleInteractionItem"
      required:
      - "titleItem"
      - "interactionItems"
    RoutingWorkType:
      type: "string"
      description: "work event type"
      enum:
      - "Acknowledged"
      - "Assigned"
      - "Accepted"
      - "Cancelled"
      - "Closed"
      - "Declined"
      - "Escalated"
      - "Failed"
      - "TransferError"
      - "Transferred"
    FieldRestrictionType:
      type: "string"
      description: "The set field indicated the restriction type for this FieldRestriction."
      enum:
      - "StringFieldRestriction"
      - "MimeTypeRestriction"
      - "FileSizeRestriction"
      - "DimensionRestriction"
      - "ArrayRestriction"
      - "RequiredFieldRestriction"
      - "TypeRestriction"
    BooleanValue:
      allOf:
      - $ref: "#/components/schemas/AbstractValue"
      - type: "object"
        properties:
          booleanValue:
            type: "boolean"
        required:
        - "booleanValue"
      description: "A boolean value"
    AgentWorkDetails:
      description: "Details about Agent Work"
      type: "object"
      properties:
        existPsr:
          type: "boolean"
          description: "If there is an existed Pending Service Routing"
        capacityPercentage:
          type: "number"
          format: "double"
          description: "Percentage of the capacity"
        capacityWeight:
          type: "number"
          format: "double"
          description: "Weight of the capacity"
        psrId:
          type: "string"
          description: "Id of Pending Service Routing"
        routingContext:
          $ref: "#/components/schemas/RoutingContext"
      required:
      - "existPsr"
      - "routingContext"
    FormResponseInputs:
      allOf:
      - $ref: "#/components/schemas/AbstractFormResponse"
      - type: "object"
        properties:
          formTitle:
            $ref: "#/components/schemas/AbstractTitleItem"
          inputValues:
            type: "array"
            items:
              $ref: "#/components/schemas/AbstractInputValue"
        required:
        - "inputValues"
      description: "The input response values to a Form Message"
    AbstractInputValue:
      type: "object"
      properties:
        inputId:
          $ref: "#/components/schemas/InputId"
        inputValueType:
          $ref: "#/components/schemas/InputValueType"
        inputlabel:
          $ref: "#/components/schemas/AbstractTitleItem"
      required:
      - "inputValueType"
      - "inputId"
      discriminator:
        propertyName: "inputValueType"
    TextInput:
      allOf:
      - $ref: "#/components/schemas/AbstractInput"
      - type: "object"
        properties:
          regEx:
            type: "string"
          prefixText:
            type: "string"
          keyboardType:
            $ref: "#/components/schemas/TextInputKeyboardType"
          maximumCharacterCount:
            type: "integer"
          textInputType:
            $ref: "#/components/schemas/TextInputType"
          textContentType:
            $ref: "#/components/schemas/TextInputContentType"
          placeholder:
            type: "string"
            description: "Placeholder text for the input"
      - type: "object"
        properties:
          dynamicPlaceholder:
            $ref: "#/components/schemas/DynamicReference"
            description: "Placeholder text for the input (dynamic)"
          dynamicMaximumCharacterCount:
            $ref: "#/components/schemas/DynamicReference"
      description: "A text input"
    ChoicesListPicker:
      allOf:
      - $ref: "#/components/schemas/AbstractChoices"
      - type: "object"
        properties:
          images:
            type: "array"
            items:
              $ref: "#/components/schemas/ImageAsset"
          message:
            $ref: "#/components/schemas/AbstractTitleItem"
          reply:
            $ref: "#/components/schemas/AbstractTitleItem"
          title:
            type: "string"
          optionItems:
            minItems: 1
            type: "array"
            items:
              $ref: "#/components/schemas/TitleOptionItem"
        required:
        - "title"
        - "optionItems"
      description: "Choices as a list picker"
    UrlValue:
      allOf:
      - $ref: "#/components/schemas/AbstractValue"
      - type: "object"
        properties:
          urlValue:
            $ref: "#/components/schemas/Url"
        required:
        - "urlValue"
      description: "A url value"
    ChoicesMessage:
      allOf:
      - $ref: "#/components/schemas/AbstractMessage"
      - type: "object"
        properties:
          choices:
            $ref: "#/components/schemas/AbstractChoices"
        required:
        - "choices"
      description: "MT message with choices"
    InputValueType:
      type: "string"
      enum:
      - "SingleInputValue"
      - "SelectedOptionsInputValue"
    DimensionRestriction:
      description: "Dimension restrictions for the message field."
      allOf:
      - $ref: "#/components/schemas/AbstractFieldRestriction"
      - type: "object"
        properties:
          x:
            type: "float"
            description: "The x dimension limits for the media. Required."
          y:
            type: "float"
            description: "The y dimension limits for the media. Required."
          dimensionType:
            description: "Indicates how the dimension field should be interpreted. Required."
            $ref: "#/components/schemas/DimensionType"
        required:
        - "dimensionType"
        - "x"
        - "y"
    AbstractMessage:
      description: "Base definition for all message types"
      type: "object"
      properties:
        customHandlingType:
          $ref: "#/components/schemas/CustomHandlingType"
        inReplyToMessageId:
          $ref: "#/components/schemas/InReplyToMessageId"
        id:
          $ref: "#/components/schemas/MessageId"
        messageType:
          $ref: "#/components/schemas/MessageType"
        references:
          type: "array"
          items:
            $ref: "#/components/schemas/RecordReference"
        contentCategory:
          $ref: "#/components/schemas/MessageContentCategory"
          description: "The category of the message"
          example: "PromotionalOutreach"
      required:
      - "id"
      - "messageType"
      discriminator:
        propertyName: "messageType"
        mapping:
          ChoicesResponseMessage: "#/components/schemas/ChoicesResponseMessage"
          InformationRequestMessage: "#/components/schemas/InformationRequestMessage"
          StaticContentMessage: "#/components/schemas/StaticContentMessage"
          AuthenticationResponseMessage: "#/components/schemas/AuthenticationResponseMessage"
          FormResponseMessage: "#/components/schemas/FormResponseMessage"
          SurveyChoicesMessage: "#/components/schemas/SurveyChoicesMessage"
          SurveyStaticContentMessage: "#/components/schemas/SurveyStaticContentMessage"
          AuthenticationRequestMessage: "#/components/schemas/AuthenticationRequestMessage"
          CommandMessage: "#/components/schemas/CommandMessage"
          PaymentRequestMessage: "#/components/schemas/PaymentRequestMessage"
          SurveyChoicesResponseMessage: "#/components/schemas/SurveyChoicesResponseMessage"
          CatalogMessage: "#/components/schemas/CatalogMessage"
          PaymentStatusMessage: "#/components/schemas/PaymentStatusMessage"
          OrderMessage: "#/components/schemas/OrderMessage"
          PaymentResponseMessage: "#/components/schemas/PaymentResponseMessage"
          FormMessage: "#/components/schemas/FormMessage"
          ChoicesMessage: "#/components/schemas/ChoicesMessage"
    CapabilitiesRequest:
      description: "Channel Capabilities details payload"
      type: "object"
      properties:
        capabilities:
          $ref: "#/components/schemas/Capabilities"
      required:
      - "capabilities"
    SingleInputValue:
      allOf:
      - $ref: "#/components/schemas/AbstractInputValue"
      - type: "object"
        properties:
          displayValue:
            type: "string"
          value:
            $ref: "#/components/schemas/AbstractValue"
        required:
        - "value"
      description: "Single value of an input"
    AddConversationHistoryRequest:
      type: "object"
      properties:
        conversationParticipants:
          minItems: 1
          description: "list of participants in the conversation"
          maxItems: 3
          type: "array"
          items:
            $ref: "#/components/schemas/ConversationParticipant"
        conversationEntries:
          minItems: 1
          description: "list of messages sent in the conversation"
          maxItems: 25
          type: "array"
          items:
            $ref: "#/components/schemas/ConversationEntryHistory"
        channelAddressIdentifier:
          type: "string"
          description: "Messaging Channel platform key"
        messagingSession:
          $ref: "#/components/schemas/AbstractMessagingSession"
      required:
      - "channelAddressIdentifier"
      - "conversationParticipants"
      - "conversationEntries"
    CustomIntegrationType:
      type: "string"
      description: "Type of custom Integration"
      enum:
      - "CustomChannelIntegration"
      - "CustomBotIntegration"
    InteractionRequest:
      type: "object"
      properties:
        json:
          $ref: "#/components/schemas/InteractionRequestJson"
        attachments:
          minItems: 0
          maxItems: 1
          type: "array"
          nullable: true
          items:
            type: "string"
            format: "binary"
      required:
      - "json"
    ConversationParticipant:
      description: "a participant in the conversation"
      type: "object"
      properties:
        leftTime:
          type: "integer"
          format: "int64"
          description: "The time when the participant left the conversation"
        displayName:
          type: "string"
          description: "name of the participant"
        participant:
          $ref: "#/components/schemas/Participant"
        joinedTime:
          type: "integer"
          format: "int64"
          description: "name of the participant"
      required:
      - "participant"
      - "joinedTime"
    PostParticipantResponse:
      description: "Response after performing actions on a conversation"
      type: "object"
      properties:
        errorDetail:
          $ref: "#/components/schemas/Error"
        success:
          type: "boolean"
          description: "Indicates whether the requested action was successfully performed"
      required:
      - "success"
    PostParticipantRequest:
      description: "Request to perform specified operation on a Participant for a Conversation"
      type: "object"
      properties:
        conversationIdentifier:
          type: "string"
        operation:
          $ref: "#/components/schemas/ParticipantOperationType"
        participants:
          minItems: 1
          maxItems: 1
          type: "array"
          items:
            $ref: "#/components/schemas/Participant"
      required:
      - "conversationIdentifier"
      - "participants"
      - "operation"
    ParticipantOperationType:
      type: "string"
      enum:
      - "Remove"
    TypingStartedIndicator:
      description: "A typing started indicator entry"
      allOf:
      - $ref: "#/components/schemas/AbstractEntry"
      - type: "object"
        properties:
          timestamp:
            type: "integer"
            format: "int64"
        required:
        - "timestamp"
    ChannelCapabilities:
      description: "A set of message type capabilities for a channel."
      type: "object"
      properties:
        channelType:
          description: "Channel type. Optional."
          $ref: "#/components/schemas/ChannelType"
        messageTypeCapabilities:
          minItems: 1
          description: "Message Type capabilities."
          type: "array"
          items:
            $ref: "#/components/schemas/MessageTypeCapabilities"
        progressIndicatorTypeCapabilities:
          type: "array"
          description: "Progress Indicator Types capabilities."
          items:
            $ref: "#/components/schemas/ProgressIndicatorTypeCapabilities"
        customIntegration:
          description: "Custom Integration. Optional"
          $ref: "#/components/schemas/AbstractCustomIntegration"
      required:
      - "messageTypeCapabilities"
    RoutingInfo:
      type: "object"
      description: "Routing related info which will be given by partner"
      properties:
        routingAttributes:
          type: "object"
          description: "List of Key value pairs defining the channel variable name mapped to the value"
          additionalProperties:
            type: "string"
        queueId:
          type: "string"
          description: "Enter queueId for the queue"
        flow:
          description: "Enter Flow details which needs to be used for routing"
          $ref: "#/components/schemas/FlowInfo"
    PostConversationEntryResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
      required:
      - "success"
    ChoicesCarousel:
      allOf:
      - $ref: "#/components/schemas/AbstractChoices"
      - type: "object"
        properties:
          title:
            type: "string"
          items:
            minItems: 1
            description: "Items must contain more than one TitleOptionItem for the choice options."
            type: "array"
            items:
              $ref: "#/components/schemas/TitleItemWithInteractions"
          images:
            type: "array"
            items:
              $ref: "#/components/schemas/ImageAsset"
        required:
        - "items"
      description: "Choices as a carousel with options"
    ErrorAttachmentUploadResult:
      allOf:
      - $ref: "#/components/schemas/AbstractAttachmentUploadResult"
      - type: "object"
        properties:
          errorMessage:
            type: "string"
            description: "A non localized message. Do not use for display in UI."
          errorType:
            $ref: "#/components/schemas/AttachmentUploadErrorType"
            description: "The type of error to be used for displaying a localized error message in UI"
        required:
        - "errorType"
      description: "Attachment upload that failed"
    UniqueIdentifier:
      type: "string"
      description: "An string identifier that identifies objects or items uniquely per message instance"
      example: "7c4cce61-df7a-4a5b-a949-3d6e3ea278b5"
    SelectedOption:
      description: "A selection option from a ChoicesSelectionsMessage"
      additionalProperties: false
      type: "object"
      properties:
        optionTitle:
          $ref: "#/components/schemas/AbstractTitleItem"
        optionId:
          $ref: "#/components/schemas/UniqueId"
          deprecated: true
        optionIdentifier:
          $ref: "#/components/schemas/UniqueIdentifier"
      required:
      - "optionIdentifier"
    InputType:
      type: "string"
      enum:
      - "SelectInput"
      - "SelectNavigationInput"
      - "OptionPickerInput"
      - "DatePickerInput"
      - "DateTimePickerInput"
      - "TextInput"
      - "StaticFooter"
      - "StaticTitle"
      - "PhotoMediaUploadInput"
      - "DocumentMediaUploadInput"
    Participant:
      description: "A Participant"
      type: "object"
      properties:
        role:
          $ref: "#/components/schemas/ParticipantRole"
          description: "The role of this participant"
        appType:
          $ref: "#/components/schemas/AppType"
        subject:
          type: "string"
          description: "Subject identifier for this participant"
          example: "005x00000000001"
        clientIdentifier:
          type: "string"
          description: "The clientIdentifier for this participant"
      required:
      - "appType"
      - "subject"
      - "role"
    Note:
      allOf:
      - $ref: "#/components/schemas/AbstractEntry"
      - type: "object"
        properties:
          abstractMessage:
            $ref: "#/components/schemas/AbstractMessage"
        required:
        - "abstractMessage"
      description: "A note entry (for private whisper messages)"
    TextValue:
      allOf:
      - $ref: "#/components/schemas/AbstractValue"
      - type: "object"
        properties:
          textValue:
            type: "string"
        required:
        - "textValue"
      description: "A text value"
    TitleImageItem:
      allOf:
      - $ref: "#/components/schemas/AbstractTitleItem"
      - type: "object"
        properties:
          imageSubTitle:
            type: "string"
          imageId:
            $ref: "#/components/schemas/UniqueId"
        required:
        - "imageId"
    ChoicesQuickReplies:
      allOf:
      - $ref: "#/components/schemas/AbstractChoices"
      - type: "object"
        properties:
          images:
            type: "array"
            items:
              $ref: "#/components/schemas/ImageAsset"
          optionItems:
            minItems: 1
            type: "array"
            items:
              $ref: "#/components/schemas/TitleOptionItem"
          text:
            $ref: "#/components/schemas/Text"
        required:
        - "text"
        - "optionItems"
      description: "Choices with quick reply options"
    AppType:
      type: "string"
      description: "Enum listing unique identifiers for app services."
      enum:
      - "custom"
      - "agent"
      - "chatbot"
      - "conversation"
      - "live_message"
      - "iamessage"
      - "digital_worker"
      - "messaging"
      - "telephony_integration"
      - "translation"
      - "voice_bot"
    Link:
      description: "A web link."
      type: "object"
      properties:
        url:
          type: "string"
      required:
      - "url"
    AbstractEntry:
      description: "Base definition for all entry types"
      type: "object"
      properties:
        entryType:
          $ref: "#/components/schemas/EntryType"
        id:
          $ref: "#/components/schemas/EntryId"
      required:
      - "id"
      - "entryType"
      discriminator:
        propertyName: "entryType"
    RoutingFailureType:
      type: "string"
      description: "How routing failed or succeeded"
      enum:
      - "None"
      - "Unknown"
      - "SubmissionError"
      - "RoutingError"
      - "Cancelled"
    InputSectionType:
      type: "string"
      enum:
      - "SingleInputSection"
    AddConversationHistoryResponse:
      type: "object"
      properties:
        conversationIdentifier:
          type: "string"
        messagingSessionId:
          type: "string"
        success:
          type: "boolean"
      required:
      - "success"
      - "messagingSessionId"
    AbstractMessagingSession:
      description: "create/attach a messaging session with the conversation"
      type: "object"
      properties:
        messagingSessionRequestType:
          $ref: "#/components/schemas/MessagingSessionRequestType"
      required:
      - "messagingSessionRequestType"
      discriminator:
        propertyName: "messagingSessionRequestType"
        mapping:
          AttachMessagingSession: "#/components/schemas/AttachMessagingSession"
          EstablishMessagingSession: "#/components/schemas/EstablishMessagingSession"
    MessagingSessionRequestType:
      type: "string"
      enum:
      - "EstablishMessagingSession"
      - "AttachMessagingSession"
    AttachMessagingSession:
      allOf:
      - $ref: "#/components/schemas/AbstractMessagingSession"
      - type: "object"
        properties:
          payload:
            $ref: "#/components/schemas/AttachMessagingSessionRequest"
        required:
        - "payload"
    EstablishMessagingSession:
      allOf:
      - $ref: "#/components/schemas/AbstractMessagingSession"
      - type: "object"
        properties:
          payload:
            $ref: "#/components/schemas/EstablishMessagingSessionRequest"
        required:
        - "payload"
    AttachMessagingSessionRequest:
      type: "object"
      properties:
        sessionId:
          type: "string"
          description: "the record id of the messaging session"
      required:
      - "sessionId"
    EstablishMessagingSessionRequest:
      type: "object"
      properties:
        startTime:
          type: "integer"
          format: "int64"
          description: "the time in milliseconds at which the session was started. System could use the seconds part of the given time as per need."
        endTime:
          type: "integer"
          format: "int64"
          description: "the time in milliseconds at which the session was ended/closed. System could use the seconds part of the given time as per need."
      required:
      - "startTime"
    AgentActionVisibilityItem:
      description: "Agent action visibility info"
      type: "object"
      properties:
        agentAction:
          $ref: "#/components/schemas/AgentActionEnum"
        visible:
          type: "boolean"
          description: "Flag to indicate action visibility"
      required:
      - "agentAction"
      - "visible"
    AbstractAsset:
      description: "The base type of an asset from which concrete asset types extends."
      type: "object"
      properties:
        description:
          type: "string"
        id:
          $ref: "#/components/schemas/UniqueId"
        mimeType:
          $ref: "#/components/schemas/MimeType"
        assetHandle:
          type: "string"
          description: "Optional external handle (token) of the asset"
        assetUrl:
          $ref: "#/components/schemas/Url"
        referenceId:
          $ref: "#/components/schemas/UniqueId"
        assetType:
          $ref: "#/components/schemas/AssetType"
      required:
      - "id"
      - "assetType"
      - "mimeType"
      - "assetUrl"
      discriminator:
        propertyName: "assetType"
    AssetReferenceValue:
      allOf:
      - $ref: "#/components/schemas/AbstractValue"
      - type: "object"
        properties:
          assetReferenceId:
            $ref: "#/components/schemas/UniqueId"
        required:
        - "assetReferenceId"
      description: "An asset reference value. Assets can be image, audio, video, document."
    CapabilityFieldRestriction:
      description: "A list of restrictions on the fields on the message format type."
      type: "object"
      properties:
        restriction:
          description: "Restriction details"
          $ref: "#/components/schemas/AbstractFieldRestriction"
        fieldJsonPath:
          type: "string"
          description: "JsonPath like pointer to a field in the message json which the restriction is applied. This field is optional for some restriction types. Required. There is only support for the root ($) and child (.) operators. - $.some.field - $.some.array - $.some.array.field"
      required:
      - "fieldJsonPath"
      - "restriction"
    PostInteractionResponse:
      type: "object"
      properties:
        conversationIdentifier:
          type: "string"
